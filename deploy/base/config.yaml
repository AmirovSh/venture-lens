apiVersion: v1
kind: ConfigMap
metadata:
  name: venture-lens-config
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
data:
  DATA_DIR: /tmp/venture-lens
  LLM_MODEL: qwen3.8-27b
  LLM_CRITIC_MODEL: deepseek-v4-flash
  LLM_SCREENING_MODEL: deepseek-v4-flash
  LLM_FALLBACK_MODEL: deepseek-v4-flash
  LLM_MAX_CONCURRENCY: "2"
  LLM_REQUESTS_PER_MINUTE: "30"
  SEARCH_REQUESTS_PER_MINUTE: "20"
  ALLOW_PUBLIC_SEARCH: "false"
  WORKER_CONCURRENCY: "1"
  WORKER_HEALTH_PORT: "8091"
  JOB_LEASE_SECONDS: "120"
  S3_BUCKET: venture-lens
  S3_REGION: us-east-1
  PYTHONDONTWRITEBYTECODE: "1"
