apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 210
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      initContainers:
        - name: migrate
          image: venture-lens-api:dev
          command: [python, -m, backend.migrate]
          envFrom: [{configMapRef: {name: venture-lens-config}}, {secretRef: {name: venture-lens-runtime}}]
          resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: "1", memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: worker
          image: venture-lens-api:dev
          command: [python, -m, backend.worker]
          ports: [{containerPort: 8091}]
          envFrom: [{configMapRef: {name: venture-lens-config}}, {secretRef: {name: venture-lens-runtime}}]
          startupProbe: {httpGet: {path: /live, port: 8091}, failureThreshold: 60, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /live, port: 8091}, periodSeconds: 10, timeoutSeconds: 2}
          readinessProbe: {httpGet: {path: /ready, port: 8091}, periodSeconds: 5, timeoutSeconds: 2}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "1", memory: 320Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: worker}}}
