apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker}
spec:
  scaleTargetRef: {name: worker}
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 120
  fallback: {failureThreshold: 3, replicas: 2}
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: KEDA_DATABASE_URL
        query: >-
          SELECT COUNT(*) FROM jobs j JOIN runs r ON r.id=j.run_id
          WHERE r.status IN ('queued','running','waiting')
          AND j.status IN ('queued','waiting')
          AND j.next_retry_at <= EXTRACT(EPOCH FROM NOW())
        targetQueryValue: "4"
