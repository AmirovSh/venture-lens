apiVersion: v1
kind: Service
metadata: {name: searxng}
spec:
  selector: {app: searxng}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: searxng}
spec:
  replicas: 1
  selector: {matchLabels: {app: searxng}}
  template:
    metadata: {labels: {app: searxng}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: search
          image: searxng/searxng@sha256:0b9f3ddd85efc8df189e6543d65702abfa8f3ed1c32229a53f7707cd12b554ef
          ports: [{containerPort: 8080}]
          env: [{name: SEARXNG_SETTINGS_PATH, value: /etc/searxng/settings.yml}]
          volumeMounts: [{name: settings, mountPath: /etc/searxng/settings.yml, subPath: settings.yml, readOnly: true}]
          startupProbe: {tcpSocket: {port: 8080}, failureThreshold: 60, periodSeconds: 2}
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 25m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
      volumes: [{name: settings, secret: {secretName: searxng-settings}}]
