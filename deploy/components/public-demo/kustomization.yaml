apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [public.yaml]
configMapGenerator:
- name: venture-lens-public-edge
  files: [Caddyfile]
  literals:
  - ARGOCD_ORIGIN=https://argocd.venture-lens.duckdns.org
- name: venture-lens-public-settings
  literals:
  - PUBLIC_ORIGIN=https://venture-lens.duckdns.org
  - REGISTRATION_ENABLED=true
  - ACCOUNT_SECURITY_ENABLED=true
patches:
- path: api-origin.yaml
