apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: venture-lens, namespace: argocd}
spec:
  project: venture-lens
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPOSITORY.git
    targetRevision: main
    path: deploy/overlays/production
  destination: {server: https://kubernetes.default.svc, namespace: venture-lens}
  syncPolicy:
    automated: {selfHeal: true, prune: true, allowEmpty: false}
    syncOptions: [RespectIgnoreDifferences=true, PruneLast=true]
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 2m}
  ignoreDifferences:
    - {group: apps, kind: Deployment, name: api, jsonPointers: [/spec/replicas]}
    - {group: apps, kind: Deployment, name: worker, jsonPointers: [/spec/replicas]}
