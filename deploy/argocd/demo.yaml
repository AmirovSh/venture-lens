# Bootstrap this manifest in the Argo CD namespace, separately from the app overlay.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: venture-lens
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/AmirovSh/venture-lens.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: venture-lens-demo
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: venture-lens
  namespace: argocd
spec:
  project: venture-lens
  source:
    repoURL: https://github.com/AmirovSh/venture-lens.git
    targetRevision: master
    path: deploy/overlays/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: venture-lens-demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - PruneLast=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: api
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: worker
      jsonPointers: [/spec/replicas]
