apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: venture-lens-demo
resources:
- ../../base
- ../../infrastructure/single-node
patches:
- target:
    kind: HorizontalPodAutoscaler
    name: api
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 2"
- target:
    kind: ScaledObject
    name: worker
  patch: "- op: replace\n  path: /spec/minReplicaCount\n  value: 1\n- op: replace\n\
    \  path: /spec/maxReplicaCount\n  value: 2\n- op: replace\n  path: /spec/fallback/replicas\n\
    \  value: 1"
- target:
    kind: Namespace
    name: venture-lens
  patch: "- op: replace\n  path: /metadata/name\n  value: venture-lens-demo"
configMapGenerator:
- name: venture-lens-config
  behavior: merge
  literals:
  - ALLOWED_ORIGINS=http://127.0.0.1:3210,http://localhost:3210,https://91.108.213.165
  - S3_PROVISION_BUCKET=true
images:
- name: venture-lens-api
  newName: venture-lens-api
  newTag: fix-revision-omitted
- name: venture-lens-web
  newName: venture-lens-web
  newTag: fix-revision-omitted
- name: venture-lens-vpn-gateway
  newName: venture-lens-vpn-gateway
  newTag: vpn-51526eaa9d61e86e
replicas:
- name: api
  count: 1
- name: worker
  count: 1
- name: web
  count: 1
- name: public-edge
  count: 1
components:
- ../../components/search
- ../../components/autoscaling
- ../../components/workstation-tunnel
- ../../components/public-demo
