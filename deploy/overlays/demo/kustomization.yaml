apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: venture-lens-demo
resources:
- ../../base
- ../../infrastructure/single-node
patches:
- target:
    kind: HorizontalPodAutoscaler
    name: api
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 2"
- target:
    kind: ScaledObject
    name: worker
  patch: "- op: replace\n  path: /spec/minReplicaCount\n  value: 1\n- op: replace\n\
    \  path: /spec/maxReplicaCount\n  value: 2\n- op: replace\n  path: /spec/fallback/replicas\n\
    \  value: 1"
- target:
    kind: Namespace
    name: venture-lens
  patch: "- op: replace\n  path: /metadata/name\n  value: venture-lens-demo"
configMapGenerator:
- name: venture-lens-config
  behavior: merge
  literals:
  - S3_PROVISION_BUCKET=true
images:
- name: venture-lens-api
  newName: ghcr.io/amirovsh/venture-lens-api
  digest: sha256:83fb5b90734c1ad9153ca3d4f56028388005b1b9fb4f4b999df2b526a9ddecd0
- name: venture-lens-web
  newName: ghcr.io/amirovsh/venture-lens-web
  digest: sha256:5308d872e53bb57f5d900e371578683e43f345c620fbebcf41037ee282b61bd4
replicas:
- name: api
  count: 1
- name: worker
  count: 1
- name: web
  count: 1
- name: public-edge
  count: 1
components:
- ../../components/search
- ../../components/autoscaling
- ../../components/public-demo
