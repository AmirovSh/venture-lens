apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: venture-lens-demo
resources:
- ../../base
- ../../infrastructure/single-node
patches:
- target:
    kind: HorizontalPodAutoscaler
    name: api
  patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
    - op: replace
      path: /spec/maxReplicas
      value: 2
- target:
    kind: ScaledObject
    name: worker
  patch: |-
    - op: replace
      path: /spec/minReplicaCount
      value: 1
    - op: replace
      path: /spec/maxReplicaCount
      value: 2
    - op: replace
      path: /spec/fallback/replicas
      value: 1
- target:
    kind: Namespace
    name: venture-lens
  patch: "- op: replace\n  path: /metadata/name\n  value: venture-lens-demo"
configMapGenerator:
- name: venture-lens-config
  behavior: merge
  literals:
  - ALLOWED_ORIGINS=http://127.0.0.1:3210,http://localhost:3210
  - S3_PROVISION_BUCKET=true
images:
- name: venture-lens-api
  newName: venture-lens-api
  newTag: demo-bootstrap
- name: venture-lens-web
  newName: venture-lens-web
  newTag: demo-bootstrap
replicas:
- name: api
  count: 1
- name: worker
  count: 1
- name: web
  count: 1
components:
- ../../components/search
- ../../components/autoscaling
