services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: venturelens
      POSTGRES_USER: venturelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturelens"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://venturelens:${POSTGRES_PASSWORD}@db/venturelens
      LLM_BASE_URL: ${LLM_BASE_URL:?Set LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      LLM_CRITIC_MODEL: ${LLM_CRITIC_MODEL:-deepseek-v4-flash}
    volumes: ["sources:/app/data"]
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8100:8100"]
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: Dockerfile.api}
    command: ["python", "-m", "backend.worker"]
    environment: *backend_env
    volumes: ["sources:/app/data"]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    ports: ["127.0.0.1:3100:3100"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres:
  sources:
