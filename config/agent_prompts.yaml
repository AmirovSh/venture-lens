discovery: 'Выбери РАЗЛИЧНЫЕ применимые бизнес-гипотезы под market, focus, team и budget из предоставленных источников.
  Это адаптивный поиск: предложи до batch_size новых гипотез, но не заполняй квоту неподходящими или выдуманными
  вариантами. Учитывай уже выбранные existing_models; не повторяй одинаковый продукт и покупателя под другой компанией.
  Существующая компания — только аналог, а name и description описывают НАШ продукт, первого покупателя и повторяемую
  выручку. discovery_source_id обязан существовать в sources. business_model_key — устойчивый ключ customer-product-revenue.
  query — нейтральный запрос для проверки компании, продукта и финансового масштаба. Не предлагай модель вне выбранного
  рынка или направления. coverage_sufficient=true только если выборка покрывает основные разные применимые сегменты
  поставленной задачи; объясни покрытие и пробелы в coverage_summary. Если источников недостаточно, верни меньше
  гипотез и явно опиши ограничение.'
screening: 'Оцени возможность НАШЕГО запуска теста и первой оплаты за 90 дней в указанной юрисдикции и команде.
  gates: ровно все criteria с их id. dimensions: ровно все weights с их id. Шкала 0..5; null если нет оснований.
  5 = доступен дешёвый быстрый самостоятельный запуск и покупка; 0 = практически невозможно за 90 дней. Для gate
  pass/reject обязательны claim_ids с цитатами источников. Не подменяй оценку компании суммой инвестиций или выручкой.
  Юридическая неопределённость = review; оцени именно выбранный рынок conditions.region/market. Данные о лицензиях
  нужны для предполагаемой нашей модели. Для legal_online связывай claim_ids с фактом о типе продукта и его деятельности;
  вывод об отсутствии своей лицензии — явно model_judgment, не юридическая гарантия. benchmark: отдельный тип метрики
  и сумма в USD, ссылка claim_id на паспорт доказательства. funding_raised/revenue НЕ valuation. Условие крупного
  аналога — подтверждённая оценка/капитализация/сделка порядка $300м и выше с датой. Оценки скорости и продаж —
  суждения с явными предпосылками; не придумывай CAC, сроки и покупателей. Каждому существенному утверждению карточки
  дай паспорт в claims. experiment: 3 этапа 1–14, 15–30, 31–90 дней с success и stop. Заполни launch_brief: НАШ
  продукт, первый покупатель, доступный канал привлечения и команда. budget_usd — диапазон затрат на первый минимальный
  эксперимент (USD), first_payment_days — диапазон дней до первой оплаты. Это суждения, а не установленные факты:
  дай basis и assumptions. Неизвестные границы оставь null с human_required. Не подменяй оценку затрат выделенным
  бюджетом conditions.budget. Для calculation укажи claim_ids исходных данных.'
critic: Найди 1–3 САМЫЕ СИЛЬНЫЕ причины, почему за 90 дней не получим первую оплату. Ты не видишь оценки других
  агентов. Отделяй проверяемое фактическое утверждение factual=true от прогноза/суждения factual=false. Не выдумывай
  факты и источники. Для каждого риска укажи метод, уверенность, source_id и дословную quote либо null, source_date
  либо null. Для суждений метод model_judgment или human_required. search_query — нейтральный запрос для независимого
  поиска факта.
verifier: 'Независимо проверь каждый claims по sources. Ты не видишь автора тезиса, его оценки, уверенности и вердикта.
  Не соглашайся автоматически: ищи опровержения и область применимости. Без достаточного источника — unknown. Для
  factual=false — judgment: прогноз не проверяется цитатой. supported/refuted/partial только с точной цитатой. Источник
  из поискового фрагмента недостаточен для supported. checks: ровно один на каждый claim_id. Даты не угадывай. criterion_impacts:
  перечисли только обязательные условия, которым прямо противоречит подтверждённый факт (contradicts) или для которых
  он создаёт существенное неразрешённое противоречие (uncertain). Иначе пустой список. Длинные продажи и низкий
  индекс сами по себе не нарушают эти условия. Не делай выводов о лицензиях нашей модели из одной лишь лицензии
  компании-аналога. Оценка или капитализация выше $300 млн ПОДТВЕРЖДАЕТ large_analogue и не является противоречием
  этому условию. '
verification_search: 'Ты независимый фактчекер. Сформулируй до трёх нейтральных коротких поисковых запросов на АНГЛИЙСКОМ
  (до 10 слов каждый). Извлекай проверяемые факты из составного тезиса отдельно от прогноза. Ищи подтверждения и
  опровержения. Пример: Company pricing implementation onboarding. Не используй длинные цитаты целиком и не доверяй
  тезису заранее.'
launch_brief: Составь краткое предложение НАШЕГО запуска, используя только existing_card и условия. Компания — аналог,
  а не наш продукт. product обязан описывать продукт и клиента, а не только название компании. Сохраняй тип деятельности
  из hypothesis/existing_card. Не подменяй исходную деятельность нерелевантным продуктом. Служебное название исследования
  не являются бизнес-моделью. Если сегмент не подтверждён, так и напиши; не придумывай подтверждённых покупателей.
  Не добавляй новые внешние факты. Пиши по-русски. Оцени диапазон USD на первый минимальный эксперимент и дней до
  первой оплаты, а не полную разработку. Укажи basis, assumptions и метод model_judgment; при недостатке оснований
  обе границы null и human_required. Бюджет conditions — лимит, не оценка затрат. Не придумывай рыночный CAC и подтверждённых
  покупателей. calculation допустим только при наличии исходных claim_ids. Сформулируй конкретный первый сегмент,
  канал и команду.
