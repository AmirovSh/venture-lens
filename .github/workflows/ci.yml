name: Verify and publish
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:local-ci-only@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.11'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python scripts/check_repository.py
      - run: npm ci && npm run build
      - run: |
          python scripts/install_platform_tools.py
          .tools/kubectl kustomize deploy/overlays/local > /tmp/local.yaml
          .tools/kubectl kustomize deploy/overlays/demo > /tmp/demo.yaml
          .tools/kubectl kustomize deploy/overlays/production > /tmp/production.yaml
          if ! grep -q REPLACE_ /tmp/production.yaml; then python platform/preflight.py /tmp/production.yaml; fi
  recovery:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      LAB_FIXTURE_PROVIDER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.11'}
      - run: pip install -r requirements.lock.txt
      - run: python scripts/install_platform_tools.py
      - run: python platform/lab.py init
      - run: python platform/lab.py build
      - run: python platform/lab.py deploy
      - run: python platform/fault_tests.py
      - run: docker build -f Dockerfile.backup -t venture-lens-backup:lab-v1 .
      - run: docker build -f platform/server/Dockerfile.vpn-gateway -t venture-lens-vpn-gateway:ci platform/server
      - run: python platform/backup_test.py
      - run: python platform/scaling_test.py
      - name: Commit only the ephemeral lab image references
        run: |
          git config user.name 'Local CI fixture'
          git config user.email 'local-ci@example.invalid'
          git add deploy/overlays/local/kustomization.yaml
          git diff --cached --quiet || git commit -m 'test: resolve local images for GitOps verification'
      - run: python platform/lab.py gitops
      - run: python platform/gitops_test.py
      - name: Export the tested images
        if: github.event_name == 'push'
        run: |
          tag=$(python -c "import json; print(json.load(open('.platform/release.json'))['tag'])")
          docker save -o release.tar "venture-lens-api:$tag" "venture-lens-web:$tag" venture-lens-backup:lab-v1 venture-lens-vpn-gateway:ci
          cp .platform/release.json release.json
          sha256sum release.tar > release.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: verified-images
          path: |
            release.tar
            release.tar.sha256
            release.json
          retention-days: 1
          compression-level: 0
      - name: Diagnostics
        if: always()
        run: |
          df -h
          docker system df
          .tools/kubectl --kubeconfig .platform/kubeconfig --context k3d-venture-lens-lab get pods -A
          .tools/kubectl --kubeconfig .platform/kubeconfig --context k3d-venture-lens-lab describe nodes
          .tools/kubectl --kubeconfig .platform/kubeconfig --context k3d-venture-lens-lab -n venture-lens-lab get events --sort-by=.metadata.creationTimestamp
          test ! -f .platform/fault-report.json || cat .platform/fault-report.json
  publish:
    if: github.event_name == 'push' && github.event.repository.fork == false
    needs: [checks, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: verified-images}
      - name: Publish immutable release
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          sha256sum -c release.tar.sha256
          docker load -i release.tar
          tag=$(python3 -c "import json; print(json.load(open('release.json'))['tag'])")
          owner="${OWNER,,}"
          for service in api web backup vpn-gateway; do
            source_tag="$tag"
            if [ "$service" = backup ]; then source_tag=lab-v1; fi
            if [ "$service" = vpn-gateway ]; then source_tag=ci; fi
            docker tag "venture-lens-$service:$source_tag" "ghcr.io/$owner/venture-lens-$service:$RELEASE_SHA"
            docker push "ghcr.io/$owner/venture-lens-$service:$RELEASE_SHA"
            docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/$owner/venture-lens-$service:$RELEASE_SHA" >> release-digests.txt
          done
          cat release-digests.txt >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
